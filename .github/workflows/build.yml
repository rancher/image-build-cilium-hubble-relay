name: Build
on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build hardened image(s)
      run: make build-image-all

    - name: Resolve image tag
      run: |
        eval "$(make -s log | grep -E '^(TAG|BUILD_META)=')"
        echo "IMG_TAG=${TAG}${BUILD_META}" >> "$GITHUB_ENV"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/rancher/hardened-cilium-hubble-relay:${{ env.IMG_TAG }}
        format: table
        exit-code: '0'
        ignore-unfixed: true
        severity: HIGH,CRITICAL
